<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Páginas Bronceadas - BonusCom</title>
    <style>
        body {
            background-color: #f4eee1;
            font-family: "Georgia", serif;
            color: #3b281a;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fdfbf7;
            border: 5px double #5c3a21;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0,0,0,0.15);
        }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 5px;
            letter-spacing: 2px;
            border-bottom: 2px solid #5c3a21;
            padding-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            font-style: italic;
            margin-bottom: 25px;
            color: #7c5c3f;
        }
        .buscador {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 2px solid #5c3a21;
            background: #fff;
            margin-bottom: 25px;
            box-sizing: border-box;
        }
        /* Contenedor de Avisos Cuadrados (BonusCom) */
        .bonuscom-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .bonuscom-card {
            border: 4px double #5c3a21;
            background: #fffef8;
            padding: 15px;
            text-align: center;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.1);
        }
        .bonuscom-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border: 2px solid #5c3a21;
            margin-bottom: 10px;
        }
        .bonuscom-card h3 {
            margin: 5px 0;
            font-size: 1.2rem;
            color: #2c1d11;
        }
        .bonuscom-card p {
            margin: 5px 0;
            font-size: 0.95rem;
        }
        .badge-descuento {
            background: #5c3a21;
            color: #fff;
            padding: 4px 8px;
            font-weight: bold;
            display: inline-block;
            margin-top: 8px;
            font-size: 0.85rem;
        }
        /* Lista tradicional de directorio */
        .lista-directorio {
            list-style: none;
            padding: 0;
        }
        .lista-item {
            padding: 8px 0;
            border-bottom: 1px dashed #d3c2a8;
            display: flex;
            justify-content: space-between;
        }
        .error-box {
            background: #ffe6e6;
            border: 2px solid #cc0000;
            color: #cc0000;
            padding: 20px;
            text-align: center;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>PÁGINAS BRONCEADAS</h1>
    <div class="subtitle">El Directorio Comercial de Mar del Plata — Beneficios BonusCom</div>

    <input type="text" id="buscadorInput" class="buscador" placeholder="Buscar comercio, dirección o servicio..." onkeyup="filtrarComercios()">

    <div id="contenidoDirectorio">Cargando directorio...</div>
</div>

<script>
let datosGlobales = [];

async function cargarDirectorio() {
    try {
        const respuesta = await fetch('comercios.json');
        if (!respuesta.ok) throw new Error("No se pudo cargar el archivo comercios.json");
        const data = await respuesta.json();
        datosGlobales = data.zonas;
        renderizar(datosGlobales);
    } catch (error) {
        document.getElementById('contenidoDirectorio').innerHTML = `
            <div class="error-box">
                <h3>Aviso del Sistema:</h3>
                <p>Hubo un pequeño detalle de sintaxis en el archivo JSON.</p>
                <p><em>Detalle técnico: ${error.message}</em></p>
            </div>
        `;
    }
}

function renderizar(zonas) {
    let htmlHTML = "";
    
    zonas.forEach(zona => {
        htmlHTML += `<h2>${zona.nombreZona}</h2>`;
        
        // 1. Separar los que tienen foto (BonusCom cuadrados) de los normales
        const destacados = zona.comercios.filter(c => c.foto && c.foto.trim() !== "" && c.nombre.trim() !== "");
        const normales = zona.comercios.filter(c => (!c.foto || c.foto.trim() === "") && c.nombre.trim() !== "");

        // Renderizar los cuadrados BonusCom si existen
        if (destacados.length > 0) {
            htmlHTML += `<div class="bonuscom-grid">`;
            destacados.forEach(c => {
                htmlHTML += `
                    <div class="bonuscom-card" data-nombre="${c.nombre.toLowerCase()}" data-dir="${c.direccion.toLowerCase()}">
                        <img src="${c.foto}" alt="${c.nombre}">
                        <h3>${c.nombre}</h3>
                        <p>${c.direccion}</p>
                        <div class="badge-descuento">${c.descuento}</div>
                    </div>
                `;
            });
            htmlHTML += `</div>`;
        }

        // Renderizar la lista tradicional abajo
        if (normales.length > 0) {
            htmlHTML += `<ul class="lista-directorio">`;
            normales.forEach(c => {
                htmlHTML += `
                    <li class="lista-item" data-nombre="${c.nombre.toLowerCase()}" data-dir="${c.direccion.toLowerCase()}">
                        <span><strong>${c.nombre}</strong> — ${c.direccion}</span>
                        <span><em>${c.descuento}</em></span>
                    </li>
                `;
            });
            htmlHTML += `</ul>`;
        }
    });

    document.getElementById('contenidoDirectorio').innerHTML = htmlHTML;
}

function filtrarComercios() {
    const texto = document.getElementById('buscadorInput').value.toLowerCase();
    const tarjetas = document.querySelectorAll('.bonuscom-card');
    const items = document.querySelectorAll('.lista-item');

    tarjetas.forEach(card => {
        const n = card.getAttribute('data-nombre');
        const d = card.getAttribute('data-dir');
        if (n.includes(texto) || d.includes(texto)) {
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }
    });

    items.forEach(item => {
        const n = item.getAttribute('data-nombre');
        const d = item.getAttribute('data-dir');
        if (n.includes(texto) || d.includes(texto)) {
            item.style.display = "flex";
        } else {
            item.style.display = "none";
        }
    });
}

cargarDirectorio();
</script>

</body>
</html>
